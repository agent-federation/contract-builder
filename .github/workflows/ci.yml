name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref supersedes the in-flight run instead of queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Typecheck
        run: bun run typecheck

      # Coverage is informational only, with no threshold: the PAP tests exercise the
      # verifier by spawning its CLI, so pap/ execution is not measurable in-process and
      # a global threshold would be misleading.
      - name: Tests
        run: bun test --coverage --coverage-reporter=lcov --coverage-dir=coverage

      - name: Generated artifacts are up to date
        run: bun run check:all

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  # C4 (#209): exercise the CORE-000 producer -> verifier -> gate chain and
  # retain its evidence. Separate from `check` and not a required status yet.
  pipeline:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Single source: pipeline/pinned-now.txt. Pinned inside the policy window
      # (2026-11-01 .. 2027-11-01); the report and the acceptance decision never
      # read the wall clock.
      - name: Read pinned evaluation time
        run: echo "PIPELINE_NOW=$(cat pipeline/pinned-now.txt)" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pack CORE-000 twice
        run: |
          set -euo pipefail
          PIPELINE_DIR="$RUNNER_TEMP/pipeline"
          mkdir -p "$PIPELINE_DIR"
          bun run pack:core000 --out "$PIPELINE_DIR/pack-a"
          bun run pack:core000 --out "$PIPELINE_DIR/pack-b"

      - name: Require byte-identical packages and an untouched checkout
        run: |
          set -euo pipefail
          PIPELINE_DIR="$RUNNER_TEMP/pipeline"
          diff -r "$PIPELINE_DIR/pack-a" "$PIPELINE_DIR/pack-b"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "::error::packing mutated the checkout"
            git status --porcelain --untracked-files=all
            exit 1
          fi

      - name: Verify each package with the CORE-000 trust policy
        run: |
          set -euo pipefail
          PIPELINE_DIR="$RUNNER_TEMP/pipeline"
          POLICY="pipeline/policy/core000-trust-policy.json"
          bun run pap -- verify "$PIPELINE_DIR/pack-a" \
            --trust-policy "$POLICY" --format json --now "$PIPELINE_NOW" \
            > "$PIPELINE_DIR/report.json"
          bun run pap -- verify "$PIPELINE_DIR/pack-b" \
            --trust-policy "$POLICY" --format json --now "$PIPELINE_NOW" \
            > "$PIPELINE_DIR/report-b.json"

      - name: Require one packageIdentity and a clean report
        run: |
          set -euo pipefail
          PIPELINE_DIR="$RUNNER_TEMP/pipeline"
          bun run pipeline/ci.ts determinism \
            "$PIPELINE_DIR/report.json" "$PIPELINE_DIR/report-b.json"

      - name: Gate the report
        run: |
          set -euo pipefail
          PIPELINE_DIR="$RUNNER_TEMP/pipeline"
          bun run gate:core000 \
            --report "$PIPELINE_DIR/report.json" \
            --policy pipeline/policy/core000-trust-policy.json \
            --out "$PIPELINE_DIR/acceptance-decision.json"
          bun run pipeline/ci.ts assert-decision \
            "$PIPELINE_DIR/acceptance-decision.json" ACCEPTED

      - name: Prove the gate fails closed on a non-PASS report
        run: |
          set -euo pipefail
          PIPELINE_DIR="$RUNNER_TEMP/pipeline"
          bun run pipeline/ci.ts tamper \
            "$PIPELINE_DIR/report.json" "$PIPELINE_DIR/tampered-report.json"
          status=0
          bun run gate:core000 \
            --report "$PIPELINE_DIR/tampered-report.json" \
            --policy pipeline/policy/core000-trust-policy.json \
            --out "$PIPELINE_DIR/tampered-decision.json" || status=$?
          if [ "$status" -ne 1 ]; then
            echo "::error::the gate must exit 1 on a non-PASS report, got $status"
            exit 1
          fi
          bun run pipeline/ci.ts assert-decision \
            "$PIPELINE_DIR/tampered-decision.json" NOT_ACCEPTED

      - name: Upload pipeline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-evidence
          path: |
            ${{ runner.temp }}/pipeline/report.json
            ${{ runner.temp }}/pipeline/report-b.json
            ${{ runner.temp }}/pipeline/acceptance-decision.json
            ${{ runner.temp }}/pipeline/tampered-decision.json
            ${{ runner.temp }}/pipeline/pack-a/assurance-package.json
          if-no-files-found: warn
          retention-days: 90

  # C6 (#216): reference + three independently implemented Phase 2a verifiers
  # against the same CORE-000 package, one pinned --now and one absolute policy
  # path. Separate and non-blocking: it is not a required status, does not gate
  # the `pipeline` job and never converts UNSUPPORTED/INCOMPLETE into a pass.
  # `pipeline/independent.ts` builds the implementations from their pinned public
  # archives, verifies the archive SHA-256 and each self-reported
  # implementationDigest, and fails on a missing/unparseable report, an identity
  # mismatch, a packageIdentity disagreement, a genuine check-level disagreement
  # or a verdict/check-outcome contradiction; an invalid batch is retained for
  # audit and never rendered as evidence Markdown.
  pipeline-independent:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Read pinned evaluation time
        run: echo "PIPELINE_NOW=$(cat pipeline/pinned-now.txt)" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Cache Bun install cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assert the pinned verifier toolchains are available
        run: |
          set -euo pipefail
          cargo --version
          go version
          python3 --version

      - name: Run the independent verification batch
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/pipeline-independent"
          bun run pipeline:independent --out "$OUT" --now "$PIPELINE_NOW"

      - name: Upload independent verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-independent-evidence
          path: |
            ${{ runner.temp }}/pipeline-independent/batch.json
            ${{ runner.temp }}/pipeline-independent/reports/*.json
            ${{ runner.temp }}/pipeline-independent/package/assurance-package.json
          if-no-files-found: error
          retention-days: 90
