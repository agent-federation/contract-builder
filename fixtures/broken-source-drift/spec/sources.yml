slice:
  id: SLICE-CORE001-10
  includes:
    - "#10"
    - "#10.1"
    - "#10.2"
  excludes:
    - "#4.4.2"
    - "#15"

fragments:
  - id: FRAG-10-TABLE-ASSERTED-AT
    source: SRC-CORE001
    source_ref: "SRC-CORE001#10/table/asserted_at"
    quote: "Время заявления, указанное автором"

  - id: FRAG-10-TABLE-SIGNED-AT
    source: SRC-CORE001
    source_ref: "SRC-CORE001#10/table/signed_at"
    quote: "Время подписания, если оно удостоверено применимым механизмом"

  - id: FRAG-10-P-NOT-INTERCHANGEABLE
    source: SRC-CORE001
    source_ref: "SRC-CORE001#10"
    quote: "Эти временные метки не являются эквивалентными."

  - id: FRAG-10.1-P2-TRUST-CONDITION
    source: SRC-CORE001
    source_ref: "SRC-CORE001#10.1"
    quote: "` signed_at` может считаться удостоверенным временем только при наличии применимого механизма доверенной временной фиксации."

  - id: FRAG-10.1-P5-NO-GLOBAL-TIME
    source: SRC-CORE001
    source_ref: "SRC-CORE001#10.1"
    quote: "UIA не предполагает наличие единого глобального доверенного времени."

  - id: FRAG-10.2-P1-MOMENT-DEFINED
    source: SRC-CORE001
    source_ref: "SRC-CORE001#10.2"
    quote: "При проверке Credential домен MUST определить, какой временной момент используется для конкретной операции."

  - id: FRAG-10.2-P4-5-REVOCATION
    source: SRC-CORE001
    source_ref: "SRC-CORE001#10.2"
    quote: "Отзыв Credential после подписания не означает автоматически, что историческая подпись была недействительной. Однако последующая подтверждённая компрометация может сделать историческую подпись непригодной для использования как доказательства."
